spring.application.name=EatEase-Server

# 数据库连接（MySQL 8+）
spring.datasource.url=jdbc:mysql://localhost:3306/eatease?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 可选：连接池（默认Hikari，简单配一下）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# 可选：端口
server.port=8080

# ========== MyBatis‑Plus 核心配置（直接用） ==========
# Mapper XML 位置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 实体类包（改成你自己的）
mybatis-plus.type-aliases-package=org.example.eateaseserver.pojo.entity
# 下划线转驼峰（user_name → userName）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 打印 SQL（开发环境开，方便调试）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ========== 可选：主键策略 ==========
mybatis-plus.global-config.db-config.id-type=auto